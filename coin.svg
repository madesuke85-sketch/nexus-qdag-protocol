<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="coinBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rim Koin Logam Luar -->
  <circle cx="250" cy="250" r="240" fill="url(#goldRim)"/>
  <circle cx="250" cy="250" r="226" fill="#070b14"/>

  <!-- Tekstur Gerigi Bezel Koin -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- Pelat Dasar Koin -->
  <circle cx="250" cy="250" r="210" fill="url(#coinBase)"/>

  <!-- Teks Melingkar Koin -->
  <path id="textCircle" d="M 250,250 m -185,0 a 185,185 0 1,1 370,0 a 185,185 0 1,1 -370,0" fill="none"/>
  <text font-family="monospace" font-size="11.5" font-weight="900" fill="#fef08a" letter-spacing="3.5">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      ★ NEXUS-QDAG PROTOCOL ★ 2.1M HARD-CAP ★ POST-QUANTUM ★
    </textPath>
  </text>

  <!-- Riak Gelombang Akustik (Suara) -->
  <circle cx="250" cy="250" r="150" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.25"/>
  <circle cx="250" cy="250" r="120" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.3"/>
  <circle cx="250" cy="250" r="90" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.2"/>

  <!-- Simbol Inti: Monogram "N" BlockDAG + Kisi Kuantum -->
  <g filter="url(#neonGlow)">
    <!-- Garis Kisi Penghubung DAG -->
    <line x1="170" y1="330" x2="250" y2="170" stroke="#00f0ff" stroke-width="6" opacity="0.4"/>
    <line x1="250" y1="170" x2="330" y2="330" stroke="#7c3aed" stroke-width="6" opacity="0.4"/>
    <line x1="170" y1="170" x2="330" y2="170" stroke="#00ff88" stroke-width="4" opacity="0.3"/>

    <!-- Huruf "N" Kuantum Terjalin -->
    <path d="M 170,330 L 170,170 L 330,330 L 330,170" 
          fill="none" 
          stroke="url(#cyanPurple)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Titik Node BlockDAG -->
    <circle cx="170" cy="170" r="14" fill="#00f0ff"/>
    <circle cx="330" cy="170" r="14" fill="#7c3aed"/>
    <circle cx="170" cy="330" r="14" fill="#7c3aed"/>
    <circle cx="330" cy="330" r="14" fill="#00ff88"/>
    <circle cx="250" cy="250" r="12" fill="#fef08a"/>
  </g>
</svg>
